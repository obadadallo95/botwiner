<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Execution-aware research pipeline</title>
  <desc id="desc">Architecture from capture through publication.</desc>
  <rect width="960" height="540" fill="white"/>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243b53; }
    .title { font-size: 24px; font-weight: 700; fill: #102a43; }
    .subtitle { font-size: 13px; fill: #627d98; }
    .axis { font-size: 12px; fill: #627d98; }
    .label { font-size: 13px; font-weight: 600; }
    .value { font-size: 14px; font-weight: 700; }
    .small { font-size: 11px; fill: #627d98; }
  </style>
  <text x="48" y="48" class="title">Execution-aware research pipeline</text><text x="48" y="72" class="subtitle">Observed data and post-hoc evidence remain separate</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#627d98"/></marker></defs><rect x="55" y="190" width="115" height="90" rx="12" fill="#f7fafc" stroke="#0f766e" stroke-width="2"/><text x="112.5" y="225" text-anchor="middle" class="label">Capture</text><text x="112.5" y="248" text-anchor="middle" class="small">raw RPC evidence</text><line x1="170" y1="235" x2="198" y2="235" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="210" y="190" width="115" height="90" rx="12" fill="#f7fafc" stroke="#0f766e" stroke-width="2"/><text x="267.5" y="225" text-anchor="middle" class="label">Normalize</text><text x="267.5" y="248" text-anchor="middle" class="small">causal events</text><line x1="325" y1="235" x2="353" y2="235" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="190" width="115" height="90" rx="12" fill="#f7fafc" stroke="#0f766e" stroke-width="2"/><text x="422.5" y="225" text-anchor="middle" class="label">Enrich</text><text x="422.5" y="248" text-anchor="middle" class="small">finalized evidence</text><line x1="480" y1="235" x2="508" y2="235" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="190" width="115" height="90" rx="12" fill="#f7fafc" stroke="#0f766e" stroke-width="2"/><text x="577.5" y="225" text-anchor="middle" class="label">Replay</text><text x="577.5" y="248" text-anchor="middle" class="small">deterministic bytes</text><line x1="635" y1="235" x2="663" y2="235" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="675" y="190" width="115" height="90" rx="12" fill="#f7fafc" stroke="#0f766e" stroke-width="2"/><text x="732.5" y="225" text-anchor="middle" class="label">Simulate</text><text x="732.5" y="248" text-anchor="middle" class="small">cost + latency</text><line x1="790" y1="235" x2="818" y2="235" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="830" y="190" width="115" height="90" rx="12" fill="#f7fafc" stroke="#0f766e" stroke-width="2"/><text x="887.5" y="225" text-anchor="middle" class="label">Publish</text><text x="887.5" y="248" text-anchor="middle" class="small">auditable result</text><path d="M 118 335 C 260 390, 705 390, 887 335" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 6"/><text x="500" y="410" text-anchor="middle" class="axis">provenance, hashes, limitations, and reproducible artifacts</text><text x="48" y="505" class="small">Causal boundary: only information available at observation time enters the execution model.</text>
</svg>
