steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/botwiner-repo/pump-collector-runner:latest'
      - '-f'
      - 'Dockerfile.runner'
      - '.'
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/botwiner-repo/pump-collector-runner:latest'
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: europe-west3
